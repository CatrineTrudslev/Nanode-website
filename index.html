<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>naNODE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      <img src="images/NaNODE_logo.png" alt="naNODE logo">
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="#">Events</a>
      <a href="#">Become a Member</a>
      <a href="#">About Us</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>

    <section class="hero-grid">
  
      <div class="hero-left">
        <h1 id="hero-headline">Loading...</h1>
  
        <div id="hero-text"></div>
  
        <a id="membership-button" href="#" class="primary-button">
          Become a member
        </a>
      </div>
  
      <div class="hero-right">
        <section class="next-event" id="next-event">
          <p class="section-label">NEXT EVENT</p>
  
          <h2 id="event-title">Loading event...</h2>
  
          <p class="event-info">
            <span id="event-date"></span>
            ·
            <span id="event-location"></span>
          </p>
  
          <p id="event-description"></p>
  
          <a href="events.html" class="text-link">
            View all events →
          </a>
        </section>
      </div>
  
    </section>
  
    <section class="linkedin">
      <a href="#">Follow naNODE on LinkedIn →</a>
    </section>
  
  </main>

  <footer>
    <div>naNODE</div>

    <div>
      <a href="#">Contact</a>
      <a href="#">LinkedIn</a>
      <a href="#">Privacy Policy</a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
